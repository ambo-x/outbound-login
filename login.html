<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outbound Fajrrr | Sign In</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tailwind.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .field { width: 100%; box-sizing: border-box; padding: 0.625rem 0.875rem; font-size: 0.875rem;
      color: #18181b; background: #fff; border: 1px solid #e4e4e7; border-radius: 0.5rem; outline: none; }
    .field::placeholder { color: #a1a1aa; }
    .field:focus { border-color: #a1a1aa; box-shadow: 0 0 0 3px rgba(161,161,170,0.15); }
    .field-label { display: block; font-size: 0.75rem; font-weight: 500; color: #52525b; margin-bottom: 0.375rem; }
    .btn { width: 100%; padding: 0.625rem 0.875rem; font-size: 0.875rem; font-weight: 600; color: #fff;
      background: #18181b; border: none; border-radius: 0.5rem; cursor: pointer; }
    .btn:hover { background: #27272a; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">
  <div class="w-full max-w-md px-4">
    <div class="text-center mb-8">
      <img src="/logo.png" alt="Outbound Fajrrr" class="h-14 mx-auto mb-1">
      <p class="text-zinc-400 text-xs">Sign in to continue</p>
    </div>

    <!-- Error banner (hidden until submit) -->
    <div id="error-banner" role="alert"
      class="hidden mb-4 px-4 py-2.5 rounded-lg text-sm bg-red-50 text-red-600 border border-red-200">
      Incorrect username or password. Please try again.
    </div>

    <form id="login-form" autocomplete="off" novalidate>
      <div class="mb-4">
        <label class="field-label" for="username">Username</label>
        <input class="field" id="username" name="username" type="text" placeholder="you@example.com" autocomplete="off">
      </div>
      <div class="mb-6">
        <label class="field-label" for="password">Password</label>
        <input class="field" id="password" name="password" type="password" placeholder="••••••••" autocomplete="off">
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>

  <script>
    // Static placeholder login. The Outbound Fajrrr app is offline, so this form
    // does NOT authenticate and does NOT transmit or store what is typed — on
    // submit it simply shows an error. No network request is made with the
    // entered credentials.
    var form = document.getElementById('login-form');
    var banner = document.getElementById('error-banner');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      banner.classList.remove('hidden');
      document.getElementById('password').value = '';
    });
  </script>
</body>
</html>
